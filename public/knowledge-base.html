            { id: 'v1', title: 'Уход за фиалками в домашних условиях', content: 'Фиалки — одни из самых популярных комнатных растений. Они требуют рассеянного света, умеренного полива и температуры 20-22°C. Полив осуществляется снизу, через поддон, чтобы вода не попадала на листья. Рекомендуется использовать отстоянную воду комнатной температуры.', author: 'Анна Зелёнова', reviewer: 'Игорь Садовников', version: 'v1', publishedAt: '16.10.2026, 16:30', date: '2024-12-15', rating: 4.8, ratingCount: 24, commentsCount: 3 },
            { id: 'v2', title: 'Размножение фиалок листом', content: 'Для размножения фиалок выбирают здоровый лист из второго ряда. Черенок срезают под углом 45° и помещают в воду или лёгкий субстрат. Корни появляются через 2-4 недели.', author: 'Анна Зелёнова', reviewer: 'Мария Цветкова', version: 'v1', publishedAt: '20.11.2024, 10:15', date: '2024-11-20', rating: 4.6, ratingCount: 18, commentsCount: 5 },
            { id: 'v3', title: 'Болезни фиалок и их лечение', content: 'Основные болезни фиалок: мучнистая роса, серая гниль, фузариоз. Лечение — фунгициды и улучшение вентиляции.', author: 'Игорь Садовников', reviewer: 'Анна Зелёнова', version: 'v2', publishedAt: '05.10.2024, 14:20', date: '2024-10-05', rating: 4.9, ratingCount: 31, commentsCount: 8 },
            {

              title: 'Полное руководство по выращиванию фиалок: от выбора сорта до цветения', 
              content: '',
              sections: [
                { id: 'intro', title: 'Введение', content: 'Фиалки (сенполии) — одни из самых популярных комнатных растений во всём мире. Их ценят за компактные размеры, разнообразие окрасок и длительное цветение. В этом руководстве мы рассмотрим все аспекты выращивания фиалок: от выбора подходящего сорта до стимуляции повторного цветения. Статья будет полезна как начинающим цветоводам, так и опытным коллекционерам.' },
                { id: 'varieties', title: 'Выбор сорта', content: 'Существует более 32 000 зарегистрированных сортов фиалок. Они различаются по размеру цветков, форме листьев, окраске и типу цветения. Миниатюрные сорта имеют розетку диаметром до 15 см, стандартные — 20-40 см, а трейлеры могут разрастаться до 60 см в диаметре. Для начинающих рекомендуется начинать с неприхотливых сортов: "Екатерина", "ЛЕ-Алтын", "РС-Герцогиня". Они устойчивы к перепадам температуры и обильно цветут.' },
                { id: 'soil', title: 'Подготовка грунта', content: 'Правильный грунт — основа здоровья фиалки. Специализированный грунт для сенполий должен быть лёгким, рыхлым и хорошо дренированным. Оптимальный состав: 50% верхового торфа, 30% перлита, 20% мха сфагнума. Кислотность должна быть в пределах pH 5.5-6.5. Перед посадкой грунт рекомендуется пропарить для уничтожения возможных вредителей и грибков. Можно использовать готовую смесь или приготовить её самостоятельно.' },
                { id: 'lighting', title: 'Освещение', content: 'Фиалкам необходим яркий рассеянный свет продолжительностью 10-14 часов в день. Прямые солнечные лучи вызывают ожоги листьев, а недостаток света приводит к вытягиванию черешков и отсутствию цветения. Оптимальное расположение — восточные или западные окна. При использовании искусственного освещения применяют люминесцентные или светодиодные лампы мощностью 18-36 Вт на полку длиной 1 метр. Расстояние от ламп до растений — 20-30 см.' },
                { id: 'watering', title: 'Полив', content: 'Полив фиалок — один из самых важных аспектов ухода. Вода должна быть отстоянной, комнатной температуры (20-22°C). Поливают фиалки снизу, через поддон, чтобы вода не попадала на листья и точку роста. Горшок ставят в поддон с водой на 15-20 минут, затем лишнюю воду сливают. Между поливами верхний слой грунта должен просохнуть на 1-2 см. Частота полива зависит от сезона: летом — 2-3 раза в неделю, зимой — 1-2 раза. Перелив опасен загниванием корней, а пересушка — потерей тургора листьев.' },
                { id: 'fertilizing', title: 'Подкормки', content: 'Фиалки нуждаются в регулярных подкормках в период активного роста и цветения. Используют специальные удобрения для сенполий с соотношением NPK 10-10-10 или 15-15-15. В период цветения применяют удобрения с повышенным содержанием фосфора и калия. Подкормки вносят каждые 2 недели в концентрации, указанной на упаковке. Зимой, когда растения находятся в состоянии покоя, подкормки прекращают или сокращают до 1 раза в месяц. Важно не перекормить растения — избыток удобрений вызывает засоление грунта и ожог корней.' },
                { id: 'transplanting', title: 'Пересадка', content: 'Пересадку фиалок проводят каждые 6-12 месяцев или когда корни полностью оплетают земляной ком. Новый горшок должен быть в 3 раза меньше диаметра розетки. На дно обязательно кладут дренаж из керамзита или пенопласта. Растение аккуратно извлекают из старого горшка, удаляют нижние листья и старые корни. При посадке точку роста не заглубляют — она должна находиться на уровне грунта. После пересадки растение не поливают 2-3 дня, затем возобновляют обычный режим полива.' },
                { id: 'propagation', title: 'Размножение', content: 'Фиалки размножают листовыми черенками, пасынками и семенами. Самый простой способ — укоренение листа. Здоровый лист срезают под углом 45°, черенок подсушивают 15-20 минут и помещают в воду или лёгкий субстрат. Корни появляются через 2-4 недели, детки — через 1-2 месяца. После формирования 2-3 пар листьев детки рассаживают в отдельные горшки. Пасынки (боковые розетки) отделяют и укореняют аналогично. Семенное размножение используют селекционеры для получения новых сортов.' },
                { id: 'diseases', title: 'Болезни и вредители', content: 'Основные болезни фиалок: мучнистая роса (белый налёт на листьях), серая гниль (пушистый налёт), фузариоз (увядание и потемнение корней). Лечение включает удаление поражённых частей, обработку фунгицидами (Топаз, Фундазол) и улучшение условий содержания. Из вредителей наиболее опасны: трипсы (серебристые пятна на листьях), паутинный клещ (тонкая паутинка), мучнистый червец (белые ватообразные комочки). Борьба с вредителями включает обработку инсектицидами (Актара, Фитоверм) и карантин заражённых растений.' },
                { id: 'flowering', title: 'Стимуляция цветения', content: 'Для обильного цветения фиалкам необходимы: яркий рассеянный свет 10-14 часов в день, температура 20-24°C, регулярные подкормки удобрениями с высоким содержанием фосфора. После окончания цветения удаляют все отцветшие цветоносы и старые листья. Это стимулирует закладку новых бутонов. Если фиалка не цветёт, проверьте: достаточно ли света, не слишком ли большой горшок, не перекормлены ли растения азотом. Иногда помогает стресс — сокращение полива на 2-3 недели с последующим возобновлением.' },

    // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
    function collectArticles(cat) {
      let arts = cat.articles || [];
      if (cat.children) {
        for (const child of cat.children) {
          arts = arts.concat(collectArticles(child));
        }
      }
      return arts;
    }

    function findCategory(cats, id) {
      for (const cat of cats) {
        if (cat.id === id) return cat;
        if (cat.children) {
          const found = findCategory(cat.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    function findPath(cats, targetId, path = []) {
      for (const cat of cats) {
        const newPath = [...path, cat.id];
        if (cat.id === targetId) return newPath;
        if (cat.children) {
          const found = findPath(cat.children, targetId, newPath);
          if (found) return found;
        }
      }
      return null;
    }

    // ===== ОСНОВНОЕ ПРИЛОЖЕНИЕ =====
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [selectedArticle, setSelectedArticle] = useState(null);
      const [expandedNodes, setExpandedNodes] = useState(new Set());
      const [searchQuery, setSearchQuery] = useState('');
      const [workspaceTab, setWorkspaceTab] = useState('drafts');
      const [showProfileDropdown, setShowProfileDropdown] = useState(false);
      const [showNotifications, setShowNotifications] = useState(false);
      const [sidebarTab, setSidebarTab] = useState('tree');

      const toggleNode = (id) => {
        setExpandedNodes(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      const handleCategoryClick = (id) => {
        setSelectedCategory(id);
        setCurrentPage('home');
        setSelectedArticle(null);
      };

      const handleArticleClick = (article) => {
        setSelectedArticle(article);
        setCurrentPage('article');
      };

      const handleSearch = () => {
        if (searchQuery.trim()) setCurrentPage('search');
      };

      const searchResults = searchQuery.trim()
        ? categories.flatMap(cat => collectArticles(cat).filter(a =>
            a.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            a.content.toLowerCase().includes(searchQuery.toLowerCase())
          ))
        : [];

      const getWorkspaceArticles = (tab) => {
        const allArticles = categories.flatMap(cat => collectArticles(cat));
        if (tab === 'comments' || tab === 'trash') return [];
        return allArticles.filter(a => a.status === tab);
      };

      const getBreadcrumbs = () => {
        if (selectedCategory) {
          const path = findPath(categories, selectedCategory);
          if (path) return path.map(id => ({ id, name: findCategory(categories, id)?.name || '' }));
        }
        return [];
      };

      return (
        <div className="min-h-screen bg-[#f5f5f0] flex flex-col">
          {/* Header */}
          <header className="bg-[#4a5d3a] shadow-lg sticky top-0 z-50">

                  </button>
                  {showNotifications && (

                      <div className="max-h-80 overflow-y-auto">

                            <div className="w-8 h-8 rounded-full bg-[#e8f0de] flex items-center justify-center flex-shrink-0">
                              <svg className="w-4 h-4 text-[#4a5d3a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            </div>
                            <div>
                              <p className="text-sm text-[#3d4f30] font-medium">Статья одобрена</p>
                              <p className="text-xs text-[#6b7f58] mt-0.5">«Уход за фиалками» прошла проверку и опубликована</p>
                              <p className="text-xs text-[#a8b89a] mt-1">2 часа назад</p>
                            </div>
                          </div>
                        </div>
                        <div className="p-4 border-b border-[#e8ede2] hover:bg-[#f0f4eb] cursor-pointer">

                            <div>

                          </div>
                        </div>

                      </div>

                        <div className="flex items-center gap-3">
                          <div className="w-12 h-12 rounded-full bg-[#8fa87a] flex items-center justify-center text-white font-bold text-lg">АЗ</div>
                          <div>
                            <p className="text-white font-semibold">Анна Зелёнова</p>
                            <p className="text-[#c8d4b8] text-sm">Автор статей</p>
                          </div>
                        </div>
                      </div>
                      <div className="p-3">
                        <div className="flex justify-between items-center py-2 px-2 rounded-lg hover:bg-[#f0f4eb] cursor-pointer" onClick={() => { setCurrentPage('profile'); setShowProfileDropdown(false); }}>

                            <svg className="w-4 h-4 text-[#6b7f58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            <span className="text-sm text-[#3d4f30]">Мой профиль</span>

                          <span className="text-xs text-[#6b7f58]">4.8 / 12 ст.</span>
                        </div>
                        <div className="flex justify-between items-center py-2 px-2 rounded-lg hover:bg-[#f0f4eb] cursor-pointer">
                          <div className="flex items-center gap-2">
                            <svg className="w-4 h-4 text-[#6b7f58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                            <span className="text-sm text-[#3d4f30]">Настройки</span>
                          </div>
                        </div>
                        <hr className="my-2 border-[#e8ede2]" />

                          <div className="flex items-center gap-2">
                            <svg className="w-4 h-4 text-[#6b7f58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                            <span className="text-sm text-[#3d4f30]">Выйти</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>

          <div className="flex flex-1 overflow-hidden">

              <aside className="w-72 bg-white border-r border-[#d4dcc8] overflow-y-auto flex-shrink-0 shadow-sm">
                {currentPage === 'article' && selectedArticle && selectedArticle.sections && selectedArticle.sections.length > 0 ? (
                  <div className="border-b border-[#e8ede2]">
                    <div className="flex">
                      <button
                        onClick={() => setSidebarTab('tree')}
                        className={`flex-1 px-4 py-3 text-sm font-medium transition-colors ${
                          sidebarTab === 'tree'
                            ? 'text-[#4a5d3a] border-b-2 border-[#4a5d3a] bg-[#f0f4eb]'
                            : 'text-[#6b7f58] hover:text-[#4a5d3a] hover:bg-[#f0f4eb]'
                        }`}
                      >
                        Дерево
                      </button>
                      <button
                        onClick={() => setSidebarTab('toc')}
                        className={`flex-1 px-4 py-3 text-sm font-medium transition-colors ${
                          sidebarTab === 'toc'
                            ? 'text-[#4a5d3a] border-b-2 border-[#4a5d3a] bg-[#f0f4eb]'
                            : 'text-[#6b7f58] hover:text-[#4a5d3a] hover:bg-[#f0f4eb]'
                        }`}
                      >
                        Содержание
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="p-4 border-b border-[#e8ede2]">
                    <h2 className="text-sm font-semibold text-[#4a5d3a] uppercase tracking-wider">Категории</h2>
                  </div>
                )}
                
                {sidebarTab === 'tree' || !selectedArticle?.sections ? (
                  <nav className="p-2">
                    {categories.map(cat => (
                      <SidebarNode key={cat.id} category={cat} expandedNodes={expandedNodes} toggleNode={toggleNode} selectedCategory={selectedCategory} handleCategoryClick={handleCategoryClick} depth={0} />
                    ))}
                  </nav>
                ) : (
                  <nav className="p-4">
                    <h3 className="text-sm font-semibold text-[#3d4f30] mb-3">Содержание</h3>
                    <div className="space-y-1">
                      {selectedArticle.sections.map((section, index) => (
                        <button
                          key={section.id}
                          onClick={() => {
                            const element = document.getElementById(section.id);
                            if (element) {
                              element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }
                          }}
                          className="w-full text-left text-sm text-[#6b7f58] hover:text-[#4a5d3a] hover:bg-[#f0f4eb] py-1.5 px-2 rounded transition-colors"
                        >
                          <span className="text-[#8fa87a] mr-2">{index + 1}.</span>
                          {section.title}
                        </button>
                      ))}
                    </div>
                  </nav>
                )}
              </aside>
            )}

            {/* Main */}
            <main className={`flex-1 overflow-y-auto bg-[#f5f5f0] ${
              currentPage === 'profile' || currentPage === 'workspace' || currentPage === 'create-draft' || currentPage === 'notifications' || currentPage === 'my-comments' || currentPage === 'my-attachments'
                ? 'flex justify-center items-start'
                : ''
            }`}>
              {currentPage === 'home' && !selectedCategory && <HomePage handleCategoryClick={handleCategoryClick} />}
              {currentPage === 'home' && selectedCategory && <CategoryPage categoryId={selectedCategory} onArticleClick={handleArticleClick} onCategoryClick={handleCategoryClick} breadcrumbs={getBreadcrumbs()} />}
              {currentPage === 'article' && selectedArticle && <ArticlePage article={selectedArticle} />}
              {currentPage === 'profile' && <ProfilePage onArticleClick={handleArticleClick} />}
              {currentPage === 'workspace' && <WorkspacePage activeTab={workspaceTab} setActiveTab={setWorkspaceTab} getArticles={getWorkspaceArticles} setCurrentPage={setCurrentPage} />}
              {currentPage === 'search' && <SearchPage results={searchResults} query={searchQuery} onArticleClick={handleArticleClick} />}
              {currentPage === 'create-draft' && <CreateDraftPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'notifications' && <NotificationsPage setCurrentPage={setCurrentPage} />}
              {currentPage === 'my-comments' && <MyCommentsPage onArticleClick={handleArticleClick} />}
              {currentPage === 'my-attachments' && <MyAttachmentsPage />}
            </main>
          </div>
        </div>
      );
    }

    function SidebarNode({ category, expandedNodes, toggleNode, selectedCategory, handleCategoryClick, depth }) {
      const isExpanded = expandedNodes.has(category.id);
      const hasChildren = category.children && category.children.length > 0;
      const isSelected = selectedCategory === category.id;
      return (
        <div>
          <div className={`flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer transition-all group ${isSelected ? 'bg-[#e8f0de] text-[#3d4f30] font-medium' : 'hover:bg-[#f0f4eb] text-[#4a5d3a]'}`} style={{ paddingLeft: `${depth * 16 + 12}px` }} onClick={() => { handleCategoryClick(category.id); if (hasChildren) toggleNode(category.id); }}>
            {hasChildren ? <svg className={`w-3 h-3 flex-shrink-0 transition-transform text-[#8fa87a] ${isExpanded ? 'rotate-90' : ''}`} fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clipRule="evenodd" /></svg> : <span className="w-3" />}

            <span className="text-sm truncate">{category.name}</span>
          </div>
          {isExpanded && hasChildren && category.children.map(child => (
            <SidebarNode key={child.id} category={child} expandedNodes={expandedNodes} toggleNode={toggleNode} selectedCategory={selectedCategory} handleCategoryClick={handleCategoryClick} depth={depth + 1} />
          ))}
        </div>
      );
    }

    function HomePage({ handleCategoryClick }) {
      return (
        <div className="p-8">
          <div className="mb-8">
            <h1 className="text-3xl font-bold text-[#3d4f30] mb-2">Добро пожаловать в базу знаний</h1>
            <p className="text-[#6b7f58] text-lg">Энциклопедия растений — уход, посадка, размножение и многое другое</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {categories.map(cat => (
              <div key={cat.id} onClick={() => handleCategoryClick(cat.id)} className="bg-white rounded-xl p-5 border border-[#d4dcc8] hover:border-[#8fa87a] hover:shadow-md transition-all cursor-pointer group">
                <div className="flex items-center gap-3 mb-3">
                  <span className="text-[#6b7f58]"><Icon name={cat.icon} className="w-7 h-7" /></span>
                  <h3 className="text-lg font-semibold text-[#3d4f30] group-hover:text-[#4a5d3a]">{cat.name}</h3>
                </div>
                <p className="text-sm text-[#6b7f58]">{cat.children ? `${cat.children.length} подкатегорий` : `${cat.articles?.length || 0} статей`}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CategoryPage({ categoryId, onArticleClick, onCategoryClick, breadcrumbs }) {
      const category = findCategory(categories, categoryId);
      if (!category) return null;
      const hasChildren = category.children && category.children.length > 0;
      const hasArticles = category.articles && category.articles.length > 0;
      return (
        <div className="p-8">
          <nav className="flex items-center gap-2 text-sm text-[#6b7f58] mb-6 flex-wrap">
            <span className="hover:text-[#4a5d3a] cursor-pointer" onClick={() => onCategoryClick('')}>Главная</span>
            {breadcrumbs.map((crumb, i) => (
              <span key={crumb.id} className="flex items-center gap-2">
                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                {i === breadcrumbs.length - 1 ? <span className="text-[#3d4f30] font-medium">{crumb.name}</span> : <span className="hover:text-[#4a5d3a] cursor-pointer" onClick={() => onCategoryClick(crumb.id)}>{crumb.name}</span>}
              </span>
            ))}
          </nav>
          <div className="flex items-center gap-4 mb-8">
            <span className="text-[#6b7f58]"><Icon name={category.icon} className="w-9 h-9" /></span>
            <div>
              <h1 className="text-2xl font-bold text-[#3d4f30]">{category.name}</h1>
              <p className="text-[#6b7f58] text-sm mt-1">{hasChildren && `${category.children.length} подкатегорий`}{hasChildren && hasArticles && ' · '}{hasArticles && `${category.articles.length} статей`}</p>

          </div>
          {hasChildren && (
            <div className="mb-8">
              <h2 className="text-lg font-semibold text-[#3d4f30] mb-4 flex items-center gap-2">

              </h2>
              <div className="bg-white rounded-xl border border-[#d4dcc8] overflow-hidden">
                {category.children.map((child, i) => (
                  <div key={child.id} onClick={() => onCategoryClick(child.id)} className={`flex items-center justify-between px-5 py-4 cursor-pointer hover:bg-[#f0f4eb] transition-colors group ${i !== category.children.length - 1 ? 'border-b border-[#e8ede2]' : ''}`}>
                    <div className="flex items-center gap-3">
                      <span className="text-[#6b7f58]"><Icon name={child.icon} className="w-5 h-5" /></span>
                      <div>
                        <span className="text-[#3d4f30] font-medium group-hover:text-[#4a5d3a]">{child.name}</span>
                        <span className="text-xs text-[#8fa87a] ml-3">{child.children ? `${child.children.length} подкат.` : `${child.articles?.length || 0} ст.`}</span>
                      </div>
                    </div>
                    <svg className="w-5 h-5 text-[#8fa87a] group-hover:text-[#4a5d3a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                  </div>
                ))}
              </div>
            </div>
          )}
          {hasArticles && (
            <div>
              <h2 className="text-lg font-semibold text-[#3d4f30] mb-4 flex items-center gap-2">
                <svg className="w-5 h-5 text-[#6b7f58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                Статьи
              </h2>
              <div className="bg-white rounded-xl border border-[#d4dcc8] overflow-hidden">
                {category.articles.map((article, i) => (
                  <div key={article.id} onClick={() => onArticleClick(article)} className={`px-5 py-4 cursor-pointer hover:bg-[#f0f4eb] transition-colors group ${i !== category.articles.length - 1 ? 'border-b border-[#e8ede2]' : ''}`}>
                    <div className="flex items-start justify-between gap-4">
                      <div className="flex-1">
                        <h3 className="text-[#3d4f30] font-medium group-hover:text-[#4a5d3a] mb-1">{article.title}</h3>
                        <p className="text-sm text-[#6b7f58] line-clamp-2">{article.content}</p>
                        <div className="flex items-center gap-4 mt-2">
                          <span className="text-xs text-[#8fa87a]">{article.author}</span>
                          <span className="text-xs text-[#a8b89a]">{article.date}</span>
                        </div>

                        <div className="flex items-center gap-1">
                          <svg className="w-4 h-4 text-[#e8a838]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" /></svg>
                          <span className="text-sm font-medium text-[#3d4f30]">{comment.rating}</span>
                        </div>
                        {comment.replies > 0 && <span className="text-xs text-[#6b7f58]">Ответов: {comment.replies}</span>}
                        <button onClick={() => handleGoToArticle(comment.articleId)} className="text-xs text-[#4a5d3a] hover:text-[#3d4f30] font-medium flex items-center gap-1">
                          <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                          Перейти к статье
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              ))
            ) : (
              <div className="p-12 text-center">
                <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-[#f0f4eb] flex items-center justify-center">
                  <svg className="w-8 h-8 text-[#8fa87a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" /></svg>
                </div>
                <h3 className="text-lg font-medium text-[#3d4f30] mb-2">Нет комментариев</h3>
                <p className="text-[#6b7f58]">Вы пока не оставляли комментариев</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // My Attachments Page
    function MyAttachmentsPage() {
      const [searchQuery, setSearchQuery] = useState('');
      const [showAddModal, setShowAddModal] = useState(false);

      const filteredAttachments = userAttachments.filter(attachment =>
        attachment.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        attachment.source.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const handleDownload = (attachment) => {
        alert(`Скачивание файла: ${attachment.name}`);
      };

      const handleView = (attachment) => {
        if (attachment.type === 'image') {
          alert(`Просмотр изображения: ${attachment.name}`);
        } else {
          alert(`Открытие документа: ${attachment.name}`);
        }
      };

      return (
        <div className="w-full p-8 max-w-5xl">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-2xl font-bold text-[#3d4f30] mb-2">Мои вложения</h1>
              <p className="text-[#6b7f58]">Все файлы и изображения, добавленные в черновики</p>
            </div>
            <button onClick={() => setShowAddModal(true)} className="flex items-center gap-2 px-5 py-2.5 rounded-lg bg-[#4a5d3a] hover:bg-[#5a6f48] text-white transition-colors shadow-md">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
              Добавить вложение
            </button>
          </div>

          <div className="mb-6">
            <div className="relative">
              <input type="text" placeholder="Поиск по вложениям..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full px-4 py-3 pl-10 rounded-lg bg-white border border-[#d4dcc8] focus:outline-none focus:ring-2 focus:ring-[#8fa87a] focus:border-transparent text-[#3d4f30]" />
              <svg className="absolute left-3 top-3.5 w-5 h-5 text-[#8fa87a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
            </div>
          </div>

          <div className="bg-white rounded-xl border border-[#d4dcc8] overflow-hidden">
            {filteredAttachments.length > 0 ? (
              <div>
                <div className="px-6 py-3 bg-[#f0f4eb] border-b border-[#e8ede2] grid grid-cols-12 gap-4 text-xs font-semibold text-[#6b7f58] uppercase tracking-wider">
                  <div className="col-span-4">Файл</div>
                  <div className="col-span-2">Размер</div>
                  <div className="col-span-2">Источник</div>
                  <div className="col-span-2">Загружен</div>
                  <div className="col-span-2">Действия</div>
                </div>
                {filteredAttachments.map((attachment, i) => (
                  <div key={attachment.id} className={`px-6 py-4 hover:bg-[#f0f4eb] transition-colors grid grid-cols-12 gap-4 items-center ${i !== filteredAttachments.length - 1 ? 'border-b border-[#e8ede2]' : ''}`}>
                    <div className="col-span-4 flex items-center gap-3">
                      {attachment.type === 'image' ? (
                        <div className="w-10 h-10 rounded-lg bg-[#d4e8f0] flex items-center justify-center flex-shrink-0">
                          <svg className="w-5 h-5 text-[#2c5f7c]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        </div>
                      ) : (
                        <div className="w-10 h-10 rounded-lg bg-[#e8f0de] flex items-center justify-center flex-shrink-0">
                          <svg className="w-5 h-5 text-[#4a5d3a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        </div>
                      )}
                      <span className="text-sm text-[#3d4f30] font-medium truncate">{attachment.name}</span>
                    </div>
                    <div className="col-span-2 text-sm text-[#6b7f58]">{attachment.size}</div>
                    <div className="col-span-2 text-sm text-[#6b7f58] truncate">{attachment.source}</div>
                    <div className="col-span-2 text-xs text-[#a8b89a]">{attachment.date}</div>
                    <div className="col-span-2 flex items-center gap-2">
                      <button onClick={() => handleView(attachment)} className="p-2 rounded-lg hover:bg-[#e8f0de] text-[#4a5d3a] transition-colors" title="Просмотр">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                      </button>
                      <button onClick={() => handleDownload(attachment)} className="p-2 rounded-lg hover:bg-[#e8f0de] text-[#4a5d3a] transition-colors" title="Скачать">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="p-12 text-center">
                <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-[#f0f4eb] flex items-center justify-center">
                  <svg className="w-8 h-8 text-[#8fa87a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                </div>
                <h3 className="text-lg font-medium text-[#3d4f30] mb-2">{searchQuery ? 'Ничего не найдено' : 'Нет вложений'}</h3>
                <p className="text-[#6b7f58]">{searchQuery ? 'Попробуйте изменить поисковый запрос' : 'Вы пока не добавляли файлы в черновики'}</p>
              </div>
            )}
          </div>

          <div className="mt-6 grid grid-cols-3 gap-4">
            <div className="bg-white rounded-xl border border-[#d4dcc8] p-4">
              <div className="text-2xl font-bold text-[#4a5d3a]">{userAttachments.length}</div>
              <div className="text-sm text-[#6b7f58]">Всего файлов</div>
            </div>
            <div className="bg-white rounded-xl border border-[#d4dcc8] p-4">
              <div className="text-2xl font-bold text-[#4a5d3a]">{userAttachments.filter(a => a.type === 'image').length}</div>
              <div className="text-sm text-[#6b7f58]">Изображений</div>
            </div>
            <div className="bg-white rounded-xl border border-[#d4dcc8] p-4">
              <div className="text-2xl font-bold text-[#4a5d3a]">{userAttachments.filter(a => a.type === 'document').length}</div>
              <div className="text-sm text-[#6b7f58]">Документов</div>
            </div>
          </div>

          {showAddModal && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
              <div className="bg-white rounded-xl p-6 max-w-md w-full mx-4">
                <h2 className="text-xl font-bold text-[#3d4f30] mb-4">Добавить вложение</h2>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-[#6b7f58] mb-2">Выберите файл</label>
                    <div className="border-2 border-dashed border-[#d4dcc8] rounded-lg p-8 text-center hover:border-[#8fa87a] transition-colors cursor-pointer">
                      <svg className="w-12 h-12 mx-auto mb-3 text-[#8fa87a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                      <p className="text-sm text-[#6b7f58]">Нажмите для выбора файла или перетащите сюда</p>
                      <p className="text-xs text-[#a8b89a] mt-1">PDF, DOC, JPG, PNG (макс. 10 МБ)</p>
                    </div>
                  </div>
                  <div className="flex gap-3">
                    <button onClick={() => setShowAddModal(false)} className="flex-1 px-4 py-2.5 rounded-lg border border-[#d4dcc8] text-[#4a5d3a] hover:bg-[#f0f4eb] transition-colors">Отмена</button>
                    <button onClick={() => { alert('Файл добавлен (демо)'); setShowAddModal(false); }} className="flex-1 px-4 py-2.5 rounded-lg bg-[#4a5d3a] hover:bg-[#5a6f48] text-white transition-colors">Добавить</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function NotificationsPage({ setCurrentPage }) {
      const [filter, setFilter] = useState('all');
      const [notifications, setNotifications] = useState([
        { id: 1, type: 'approved', title: 'Статья одобрена', message: '«Уход за фиалками в домашних условиях» прошла проверку и опубликована', time: '2 часа назад', read: false },
        { id: 2, type: 'comment', title: 'Новый комментарий', message: 'Игорь Садовников оставил комментарий к вашей статье «Правильный полив фаленопсиса»', time: '5 часов назад', read: false },
        { id: 3, type: 'review', title: 'Запрос на проверку', message: '«Пересадка фаленопсиса» отправлена на рецензию куратору', time: 'Вчера, 14:30', read: false },
        { id: 4, type: 'comment', title: 'Ответ на комментарий', message: 'Мария Цветкова ответила на ваш комментарий в статье «Размножение фиалок листом»', time: 'Вчера, 10:15', read: true },
        { id: 5, type: 'system', title: 'Обновление системы', message: 'Добавлена новая функция «Материалы по теме». Ознакомьтесь с документацией.', time: '2 дня назад', read: true },
        { id: 6, type: 'approved', title: 'Статья одобрена', message: '«Хамедорея изящная — уход» прошла проверку и опубликована', time: '3 дня назад', read: true },
        { id: 7, type: 'comment', title: 'Новый комментарий', message: 'Пётр Колючкин оставил комментарий к вашей статье «Нефролепис — самый популярный папоротник»', time: '4 дня назад', read: true },
        { id: 8, type: 'review', title: 'Статья возвращена на доработку', message: 'Куратор указал на необходимость дополнить раздел о болезнях в статье «Фикус Бенджамина»', time: '5 дней назад', read: true },
        { id: 9, type: 'system', title: 'Новый куратор', message: 'Елена Орхидеева назначена куратором раздела «Орхидеи»', time: 'Неделю назад', read: true },
        { id: 10, type: 'approved', title: 'Черновик сохранён', message: 'Ваш черновик «Болезни фиалок и их лечение» автоматически сохранён', time: 'Неделю назад', read: true },
      ]);

      const markAsRead = (id) => {
        setNotifications(notifications.map(n => n.id === id ? { ...n, read: true } : n));
      };

      const markAllAsRead = () => {
        setNotifications(notifications.map(n => ({ ...n, read: true })));
      };

      const filteredNotifications = notifications.filter(n => {
        if (filter === 'unread') return !n.read;
        if (filter === 'read') return n.read;
        return true;
      });

      const unreadCount = notifications.filter(n => !n.read).length;

      const getNotificationIcon = (type) => {
        switch (type) {
          case 'approved':
            return <div className="w-10 h-10 rounded-full bg-[#e8f0de] flex items-center justify-center flex-shrink-0"><svg className="w-5 h-5 text-[#4a5d3a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>;
          case 'comment':
            return <div className="w-10 h-10 rounded-full bg-[#fef3cd] flex items-center justify-center flex-shrink-0"><svg className="w-5 h-5 text-[#856404]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg></div>;
          case 'review':
            return <div className="w-10 h-10 rounded-full bg-[#d4e8f0] flex items-center justify-center flex-shrink-0"><svg className="w-5 h-5 text-[#2c5f7c]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>;
          case 'system':
            return <div className="w-10 h-10 rounded-full bg-[#e8ede2] flex items-center justify-center flex-shrink-0"><svg className="w-5 h-5 text-[#6b7f58]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div>;
        }
      };

      return (
        <div className="w-full p-8 max-w-4xl">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-2xl font-bold text-[#3d4f30] mb-2">Уведомления</h1>
              <p className="text-[#6b7f58]">{unreadCount > 0 ? `${unreadCount} непрочитанных` : 'Все уведомления прочитаны'}</p>
            </div>
            {unreadCount > 0 && (
              <button onClick={markAllAsRead} className="flex items-center gap-2 px-4 py-2 rounded-lg bg-white hover:bg-[#f0f4eb] text-[#4a5d3a] border border-[#d4dcc8] transition-colors text-sm">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                Прочитать все
              </button>
            )}
          </div>

          <div className="flex gap-2 mb-6">
            <button onClick={() => setFilter('all')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${filter === 'all' ? 'bg-[#4a5d3a] text-white shadow-md' : 'bg-white text-[#4a5d3a] border border-[#d4dcc8] hover:bg-[#f0f4eb]'}`}>
              Все ({notifications.length})
            </button>
            <button onClick={() => setFilter('unread')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${filter === 'unread' ? 'bg-[#4a5d3a] text-white shadow-md' : 'bg-white text-[#4a5d3a] border border-[#d4dcc8] hover:bg-[#f0f4eb]'}`}>
              Непрочитанные ({unreadCount})
            </button>
            <button onClick={() => setFilter('read')} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${filter === 'read' ? 'bg-[#4a5d3a] text-white shadow-md' : 'bg-white text-[#4a5d3a] border border-[#d4dcc8] hover:bg-[#f0f4eb]'}`}>
              Прочитанные ({notifications.length - unreadCount})
            </button>
          </div>

          <div className="bg-white rounded-xl border border-[#d4dcc8] overflow-hidden">
            {filteredNotifications.length > 0 ? (
              filteredNotifications.map((notification, i) => (
                <div key={notification.id} onClick={() => !notification.read && markAsRead(notification.id)} className={`px-6 py-4 cursor-pointer transition-colors ${!notification.read ? 'bg-[#f9faf5]' : 'bg-white'} hover:bg-[#f0f4eb] ${i !== filteredNotifications.length - 1 ? 'border-b border-[#e8ede2]' : ''}`}>
                  <div className="flex items-start gap-4">
                    {getNotificationIcon(notification.type)}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-start justify-between gap-2 mb-1">
                        <h3 className={`text-sm ${!notification.read ? 'font-semibold text-[#3d4f30]' : 'font-medium text-[#4a5d3a]'}`}>{notification.title}</h3>
                        {!notification.read && <span className="w-2 h-2 bg-[#4a5d3a] rounded-full flex-shrink-0 mt-1.5"></span>}
                      </div>
                      <p className="text-sm text-[#6b7f58] mb-1">{notification.message}</p>
                      <p className="text-xs text-[#a8b89a]">{notification.time}</p>
                    </div>
                  </div>
                </div>
              ))
            ) : (
              <div className="p-12 text-center">
                <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-[#f0f4eb] flex items-center justify-center">
                  <svg className="w-8 h-8 text-[#8fa87a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                </div>
                <h3 className="text-lg font-medium text-[#3d4f30] mb-2">Нет уведомлений</h3>
                <p className="text-[#6b7f58]">{filter === 'unread' ? 'Все уведомления прочитаны' : 'В этой категории пока нет уведомлений'}</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
